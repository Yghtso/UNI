<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <title>Lettere che cadono</title>
        <style>
            body {
                font-family: "Times New Roman", serif;
            }

            header {
                background-color: blue;
                color: white;
                text-align: center;
                padding: 0.5em;
            }

            header h1 {
                margin: 0;
                font-size: 1.2em;
            }

            main {
                border: 2px solid black;
                margin: 1em;
                padding: 0.5em 1em;
            }

            main p {
                font-weight: bold;
            }

            #parole {
                font-size: 1.2em;
                width: 20em;
                padding: 0.2em;
            }

            #inizia {
                font-size: 1.2em;
                padding: 0.2em 0.4em;
            }

            #gioco {
                display: none;
            }

            #areaGioco {
                display: block;
                margin: 0 auto 1em auto;
                border: 2px solid blue;
                background-color: lightgoldenrodyellow;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Lettere che cadono</h1>
        </header>
        <main>
            <div id="menu">
                <p>Inserisci 4 parole (3-6 lettere ciascuna, solo lettere, separate da spazi).</p>
                <p>
                    <input type="text" id="parole" placeholder="es: sedia bici libro vento">
                    <button type="button" id="inizia" disabled>Inizia</button>
                </p>
                <p>Comandi: A sinistra, D destra</p>
            </div>

            <div id="gioco">
                <p id="messaggio">Parole: <span id="listaParole"></span></p>
                <p>Progresso: <span id="fatte">0</span> / <span id="totale">0</span></p>
                <canvas id="areaGioco" width="640" height="425"></canvas>
            </div>
        </main>
        <script>


            
        </script>
    </body>
</html>
