<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                background-color: lightgray;
                font-family: Arial, sans-serif;
            }

            /* Griglia esterna: pannello sinistro fisso, destro prende il resto */
            main {
                display: grid;
                grid-template-columns: 250px 1fr;
                gap: 1rem;
                align-items: start;
                max-width: 1100px;
                margin: auto;
            }

            #menuPanel {
                background-color: white;
                border-radius: 0.3em;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                padding: 1em;
                gap: 1em;
            }

            /* Il pannello destro e' solo un contenitore: il box bianco e' la barra di ricerca */
            #coursesPanel {
                display: flex;
                flex-direction: column;
                gap: 1em;
            }

            #coursesPanelTopBar {
                background-color: white;
                border-radius: 0.3em;
                padding: 1em;
            }

            form {
                display: flex;
                flex-direction: column;
                gap: 0.5em;
                margin-bottom: 2em;
            }

            input {
                height: 2.5em;
                border-radius: 0.3em;
            }

            #removeAll {
                background-color: red;
                color: white;
                height: 3em;
            }

            h1 {
                text-align: center;
            }

            #searchBar {
                width: 88%;
            }

            .invalid_input {
                background-color: #ffe6e6;
                border-color: red;
            }

            /* Griglia interna: 3 colonne di schede, vanno a capo da sole */
            #courses {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
                align-items: start;
            }

            .scheda {
                border-radius: 0.3em;
                padding: 1em;
            }

            .scheda h3 {
                margin-top: 0;
                font-size: 1em;
            }

            .persona {
                background-color: white;
                border-radius: 0.3em;
                padding: 0.6em;
                margin-top: 0.6em;
            }

            .persona b {
                display: block;
            }

            .colore0 { background-color: #ffe082; }
            .colore1 { background-color: #b2dfdb; }
            .colore2 { background-color: #c5e1a5; }
            .colore3 { background-color: #f8bbd0; }
            .colore4 { background-color: #d1c4e9; }
        </style>
    </head>
    <body>
        <header>
            <h1>Gestione Abbonamenti Palestra</h1>
        </header>
        <main>
            <div id="menuPanel">
                <h2>Aggiungi un nuovo abbonamento</h2>
                <form>
                    <input type="text" name="nomeAbbonato" placeholder="Nome abbonato">
                    <input type="number" name="eta" placeholder="Età">
                    <input type="text" name="nomeCorso" placeholder="Corso scelto">
                    <input type="submit" value="Aggiungi abbonamento">
                </form>
                <button id="removeAll">Rimuovi tutti gli abbonamenti</button>
            </div>
            <div id="coursesPanel">
                <div id="coursesPanelTopBar">
                    <h2>Cerca abbonamenti</h2>
                    <input type="text" id="searchBar" placeholder="Cerca per nome abbonato">
                </div>
                <div id="courses">

                </div>
            </div>
        </main>
        <script>
            class Persona {
                constructor(name, age) {
                    this.name = name;
                    this.age = age;
                }
            }

            class Corso {
                constructor(partecipanti) {
                    this.partecipanti = partecipanti;
                }

                aggiungi(persona) {
                    this.partecipanti.push(persona);
                }
            }

            const CHIAVE = "abbonamenti";

            // getElementsByTagName restituisce una lista: serve l'elemento [0]
            const form = document.getElementsByTagName("form")[0];
            const searchBar = document.getElementById("searchBar");
            const removeAll = document.getElementById("removeAll");
            const coursesDiv = document.getElementById("courses");

            // oggetto: chiave = nome del corso, valore = oggetto Corso
            let courses = {};

            function salva() {
                localStorage.setItem(CHIAVE, JSON.stringify(courses));
            }

            // JSON.parse restituisce oggetti "semplici": li ricostruisco come Corso e Persona
            function carica() {
                const testo = localStorage.getItem(CHIAVE);
                if (testo == null) {
                    return;
                }
                const dati = JSON.parse(testo);
                for (let nomeCorso in dati) {
                    const corso = new Corso(new Array());
                    const lista = dati[nomeCorso].partecipanti;
                    for (let i = 0; i < lista.length; i++) {
                        corso.aggiungi(new Persona(lista[i].name, lista[i].age));
                    }
                    courses[nomeCorso] = corso;
                }
            }

            function creaPersona(p) {
                const div = document.createElement("div");
                div.className = "persona";
                const nome = document.createElement("b");
                nome.textContent = p.name;
                const eta = document.createElement("span");
                eta.textContent = "Età: " + p.age;
                div.appendChild(nome);
                div.appendChild(eta);
                return div;
            }

            // Ridisegna tutte le schede: la griglia CSS le dispone da sola
            function mostra() {
                coursesDiv.innerHTML = "";
                const filtro = searchBar.value.toLowerCase();
                let indice = 0;   // posizione del corso, serve per il colore

                for (let nomeCorso in courses) {
                    const scheda = document.createElement("div");
                    scheda.className = "scheda colore" + (indice % 5);
                    indice++;

                    const titolo = document.createElement("h3");
                    titolo.textContent = nomeCorso;
                    scheda.appendChild(titolo);

                    const lista = courses[nomeCorso].partecipanti;
                    let trovati = 0;
                    for (let i = 0; i < lista.length; i++) {
                        if (lista[i].name.toLowerCase().indexOf(filtro) != -1) {
                            scheda.appendChild(creaPersona(lista[i]));
                            trovati++;
                        }
                    }

                    // se la ricerca non trova nessuno nel corso, la scheda non compare
                    if (trovati > 0) {
                        coursesDiv.appendChild(scheda);
                    }
                }
            }

            form.addEventListener("submit", e => {
                e.preventDefault();

                const inputCorso = form.elements.nomeCorso;
                const inputNome  = form.elements.nomeAbbonato;
                const inputEta   = form.elements.eta;
                const campi = [inputNome, inputEta, inputCorso];

                let valido = true;
                for (let i = 0; i < campi.length; i++) {
                    if (campi[i].value.trim() == "") {
                        campi[i].classList.add("invalid_input");
                        valido = false;
                    } else {
                        campi[i].classList.remove("invalid_input");
                    }
                }

                if (!valido) {
                    return;   // l'inserimento non ha luogo
                }

                const nomeCorso = inputCorso.value.trim();
                if (courses[nomeCorso] == undefined) {
                    courses[nomeCorso] = new Corso(new Array());
                }
                courses[nomeCorso].aggiungi(new Persona(inputNome.value.trim(), inputEta.value));

                salva();
                mostra();
                form.reset();
            });

            searchBar.addEventListener("input", mostra);

            removeAll.addEventListener("click", () => {
                courses = {};
                localStorage.removeItem(CHIAVE);
                mostra();
            });

            carica();
            mostra();
        </script>
    </body>
</html>
