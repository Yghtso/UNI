<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                background-color: lightgray;
            }

            main {
                display: flex;
                align-items: flex-start;
                justify-content: space-around;
                gap: 0.3rem;
            }

            #menuPanel {
                background-color: white;
                border-radius: 0.3em;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                padding: 1em;
                gap: 1em;
                width: 20%;
            }

            #coursesPanel {
                background-color: white;
                border-radius: 0.3em;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                padding: 1em;
                gap: 1em;
                flex: 1;
            }

            form {
                display: flex;
                flex-direction: column;
                gap: 0.5em;
                margin-bottom: 2em;
            }

            input {
                height: 2.5em;
                border-radius: 0.3em;
            }

            #removeAll {
                background-color: red;
                color: white;
                height: 3em;
            }

            h1 {
                text-align: center;
            }

            #searchBar {
                width: 88%;
            }

        </style>
    </head>
    <body>
        <header>
            <h1>Gestione Abbonamenti Palestra</h1>
        </header>
        <main>
            <div id="menuPanel">
                <h2>Aggiungi un nuovo abbonamento</h2>
                <form>
                    <input type="text" name="nomeAbbonato" placeholder="Nome abbonato">
                    <input type="number" name="eta" placeholder="Età">
                    <input type="text" name="nomeCorso" placeholder="Corso scelto">
                    <input type="submit" value="Aggiungi abbonamento">
                </form>
                <button id="removeAll">Rimuovi tutti gli abbonamenti</button>
            </div>
            <div id="coursesPanel">
                <div id="coursesPanelTopBar">
                    <h2>Cerca abbonamenti</h2>
                    <input type="text" id="searchBar">
                </div>
                <div id="courses">

                </div>
            </div>
        </main>
        <script>
            class Persona {
                constructor(name, age) {
                    this.name = name;
                    this.age = age;
                }
            }

            class Corso {
                constructor(partecipanti) {
                    this.partecipanti = partecipanti;
                }
            }
            
            const form = document.getElementsByTagName("form");
            const searchBar = document.getElementById("searchBar");
            const removeAll = document.getElementById("removeAll");
        
            form.addEventListener("submit", e => {
            e.preventDefault();
            });

        </script>
    </body>
</html>
