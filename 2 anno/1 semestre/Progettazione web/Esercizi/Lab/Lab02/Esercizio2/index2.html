
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Media Ranking</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }

    caption {
      font-style: italic;
      margin-bottom: 5px;
    }

    th, td {
      border: 1px solid gray;
      padding: 6px;
    }

    thead {
      background-color: orange;
      color: white;
    }

    tbody tr:nth-child(even) {
      background-color: lightgray;
    }

    td:first-child {
      text-align: center;
    }

    td:nth-child(2) {
      padding-left: 30px;
    }

    td:last-child {
      text-align: center;
    }

    tfoot {
      background-color: orange;
      text-align: center;
    }
  </style>
</head>
<body>

  <table>
    <caption>Top 10 Classifica Social</caption>

    <thead>
      <tr>
        <th>Rank</th>
        <th>Social</th>
        <th>Active Users</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>1</td>
        <td>Facebook</td>
        <td>2498 ML</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Youtube</td>
        <td>2000 ML</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Whatsapp</td>
        <td>2000 ML</td>
      </tr>
      <tr>
        <td>4</td>
        <td>FB Messenger</td>
        <td>1300 ML</td>
      </tr>
      <tr>
        <td>5</td>
        <td>We Chat</td>
        <td>1165 ML</td>
      </tr>
      <tr>
        <td>6</td>
        <td>Instagram</td>

      </tr>
      <tr>

      <tr>

      </tr>
      <tr>
        <td>9</td>
        <td>QZone</td>
        <td>517 ML</td>
      </tr>
      <tr>
        <td>10</td>
        <td>Weibo</td>

      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="3">
          <a href="#">Data Source</a>
        </td>
      </tr>

</body>
</html>
