<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <!-- an HTML <table> contains any number of rows (<tr>) 
            • each row contains any number of table data cells (<td>) 
            • Content goes inside of <td></td> tags
            • Exist <th></th> tags for table headers
         -->

        <table>
            <tr>
                <!-- Browsers tend to make the content within a <th> element bold 
                    • <th> element for accessibility (it helps those using screen readers) 
                    • Provides some semantic info about the row being a row of headers 
                -->

                <th>Header 1</th>
                <th>Header 2</th>
            </tr>
            <tr>
                <!-- Each row must have the same number of <td> or <th> containers. If you want a given cell to cover several columns or rows:
                    • Use the colspan attribute to make a cell span multiple columns 
                    • Use the rowspan attribute to make a cell span multiple rows 
                 -->

                <td colspan="2">Row 1, Cell 1, some other content to check column spanning</td>  
            </tr>
            <tr>
                <td rowspan="2">Row 2, Cell 1</td>
                <td>Row 2, Cell 2</td>
                <td>Row 2, Cell 3</td>
                <td>Row 2, Cell 4</td>
            </tr>
            <tr>4
                <td>Row 3, Cell 1</td>
                <td>Row 3, Cell 2</td>
            </tr>
        </table>
        </body>
</html>

<style>
    table {
        border: 1px solid black;
    }

    th, td {
        border: 1px solid black;
        padding: 10px;
    }
</style>
