# Same behaviour as XAMPP's htdocs (httpd.conf + httpd-xampp.conf)
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
<FilesMatch "\.phps$">
    SetHandler application/x-httpd-php-source
</FilesMatch>

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks Includes
    AllowOverride All
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.shtml index.html index.htm \
                   default.php default.html default.htm home.php home.html home.htm
</IfModule>

# Course exercises folder, read-only: http://localhost/esercizi/
Alias /esercizi "/esercizi"
<Directory "/esercizi">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
